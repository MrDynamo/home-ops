---
# ServiceAccount + Role + RoleBinding for the longhorn-pdb-pruner Deployment.
# Scoped entirely to the storage namespace since the pruner only ever
# touches PodDisruptionBudgets here (see deployment.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-pdb-pruner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: longhorn-pdb-pruner
rules:
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: longhorn-pdb-pruner
subjects:
  - kind: ServiceAccount
    name: longhorn-pdb-pruner
roleRef:
  kind: Role
  name: longhorn-pdb-pruner
  apiGroup: rbac.authorization.k8s.io
---
# TalosUpgrade is cluster-scoped, so reading status.currentNode(s) needs a ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-pdb-pruner
rules:
  - apiGroups: ["tuppr.home-operations.com"]
    resources: ["talosupgrades"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-pdb-pruner
subjects:
  - kind: ServiceAccount
    name: longhorn-pdb-pruner
    namespace: storage
roleRef:
  kind: ClusterRole
  name: longhorn-pdb-pruner
  apiGroup: rbac.authorization.k8s.io
